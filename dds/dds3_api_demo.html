<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDS WebAssembly JavaScript API Demo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #4ade80;
            --error: #f87171;
            --code-bg: #090d16;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 32px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 28px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.05rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"], select {
            background-color: var(--code-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
            color: #fff;
            transform: translateY(-1px);
        }

        button.btn-accent {
            background-color: var(--accent);
            color: #fff;
        }

        button.btn-accent:hover {
            background-color: #9333ea;
        }

        .output-box {
            background-color: var(--code-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
            color: var(--success);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }

        table.dd-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        table.dd-table th, table.dd-table td {
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            text-align: center;
        }

        table.dd-table th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--primary);
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .status.loading { background-color: #0284c7; color: white; }
        .status.ready { background-color: #166534; color: #bbf7d0; }
        .status.error { background-color: #991b1b; color: #fecaca; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DDS WebAssembly JavaScript API</h1>
            <p class="subtitle">Direct browser execution of C++ Double Dummy Solver via Embind</p>
        </header>

        <div id="status" class="status loading">Loading WASM Module...</div>

        <div class="card">
            <h2>Deal Deal PBN Input <span class="badge">PBN Format</span></h2>
            <div class="input-group">
                <label for="pbn">PBN Remaining Cards String:</label>
                <input type="text" id="pbn" value="N:QJ6.K652.J85.T98 873.J97.AT764.Q4 K5.T83.KQ9.A7652 AT942.AQ4.32.KJ3">
            </div>

            <div style="display: flex; gap: 16px;">
                <div class="input-group" style="flex: 1;">
                    <label for="trump">Trump Suit:</label>
                    <select id="trump">
                        <option value="4" selected>NT (No Trumps)</option>
                        <option value="0">♠ Spades</option>
                        <option value="1">♥ Hearts</option>
                        <option value="2">♦ Diamonds</option>
                        <option value="3">♣ Clubs</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label for="first">First to Play:</label>
                    <select id="first">
                        <option value="0" selected>North</option>
                        <option value="1">East</option>
                        <option value="2">South</option>
                        <option value="3">West</option>
                    </select>
                </div>
            </div>

            <div class="btn-group">
                <button onclick="runSolveBoard()">solveBoardPBN()</button>
                <button onclick="runCalcDDTable()">calcDDTablePBN()</button>
                <button onclick="runCalcPar()">calcParPBN()</button>
                <button onclick="runWithContext()" class="btn-accent">Test SolverContext Reuse</button>
            </div>
        </div>

        <div class="card">
            <h2>Execution Results</h2>
            <div id="table-output"></div>
            <pre id="output" class="output-box">Ready for execution.</pre>
        </div>
    </div>

    <!-- Load compiled WASM JS bundle -->
    <script src="dds3_wasm_api.js"></script>
    <script src="dds3_api.js"></script>
    <script>
        let ddsApi = null;
        let reusableContext = null;
        const outputElem = document.getElementById('output');
        const statusElem = document.getElementById('status');
        const tableOutputElem = document.getElementById('table-output');

        async function init() {
            try {
                ddsApi = await DDS.init();
                reusableContext = ddsApi.createContext();
                statusElem.textContent = "DDS WASM JS API Ready";
                statusElem.className = "status ready";
            } catch (err) {
                statusElem.textContent = "Failed to load WASM API: " + err.message;
                statusElem.className = "status error";
                outputElem.textContent = err.stack || err;
            }
        }

        function logOutput(obj) {
            outputElem.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
        }

        async function runSolveBoard() {
            if (!ddsApi) return;
            tableOutputElem.innerHTML = '';
            const pbn = document.getElementById('pbn').value;
            const trump = parseInt(document.getElementById('trump').value);
            const first = parseInt(document.getElementById('first').value);
            const res = ddsApi.solveBoardPBN(pbn, trump, first);
            logOutput(res);
        }

        async function runCalcDDTable() {
            if (!ddsApi) return;
            const pbn = document.getElementById('pbn').value;
            const res = ddsApi.calcDDTablePBN(pbn);
            logOutput(res);

            // Render DD Table
            const suits = ['♠', '♥', '♦', '♣', 'NT'];
            const seats = ['N', 'E', 'S', 'W'];
            let html = '<table class="dd-table"><thead><tr><th>Strain</th><th>N</th><th>E</th><th>S</th><th>W</th></tr></thead><tbody>';
            for (let strain = 0; strain < 5; strain++) {
                html += `<tr><th>${suits[strain]}</th>`;
                for (let seat = 0; seat < 4; seat++) {
                    html += `<td>${res.resTable[strain][seat]}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            tableOutputElem.innerHTML = html;
        }

        async function runCalcPar() {
            if (!ddsApi) return;
            tableOutputElem.innerHTML = '';
            const pbn = document.getElementById('pbn').value;
            const res = ddsApi.calcParPBN(pbn, 0);
            logOutput(res);
        }

        async function runWithContext() {
            if (!ddsApi || !reusableContext) return;
            tableOutputElem.innerHTML = '';
            const pbn = document.getElementById('pbn').value;
            const trump = parseInt(document.getElementById('trump').value);
            const first = parseInt(document.getElementById('first').value);
            
            reusableContext.resetForSolve();
            const start = performance.now();
            const res = ddsApi.solveBoardPBN(pbn, trump, first, [], [], -1, 3, 0, reusableContext);
            const elapsed = (performance.now() - start).toFixed(2);
            
            logOutput({
                note: `Solved using reusable SolverContext in ${elapsed} ms`,
                result: res
            });
        }

        window.onload = init;
    </script>
</body>
</html>
